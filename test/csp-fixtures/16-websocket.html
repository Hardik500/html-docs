<!DOCTYPE html>
<html>
<body>
  <!-- csp-expect: blocked — this fixture asserts the policy DENIES these references -->
  <pre id="out">Connecting...</pre>
  <script>
    // Tries to reach an origin that is not on connect-src — must be blocked
    try {
      const ws = new WebSocket('wss://echo.websocket.org');
      ws.onopen = () => { document.getElementById('out').textContent = 'Connected!'; };
      ws.onerror = (e) => { document.getElementById('out').textContent = 'WS error (expected under CSP)'; };
    } catch(e) {
      document.getElementById('out').textContent = 'Error: ' + e.message;
    }
  </script>
