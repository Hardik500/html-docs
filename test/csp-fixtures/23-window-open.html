<!DOCTYPE html>
<html>
<body>
  <button onclick="tryOpen()">Open new window</button>
  <p id="out"></p>
  <script>
    // window.open is blocked when sandbox lacks allow-popups
    function tryOpen() {
      try {
        const w = window.open('https://example.com', '_blank');
        document.getElementById('out').textContent = w ? 'Opened' : 'Blocked (null)';
      } catch(e) {
        document.getElementById('out').textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
