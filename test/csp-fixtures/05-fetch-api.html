<!DOCTYPE html>
<html>
<body>
  <pre id="out">Loading...</pre>
  <script>
    // Tries to fetch an external API — blocked by connect-src 'none'
    fetch('https://jsonplaceholder.typicode.com/todos/1')
      .then(r => r.json())
      .then(d => { document.getElementById('out').textContent = JSON.stringify(d); })
      .catch(e => { document.getElementById('out').textContent = 'Error: ' + e.message; });
  </script>
</body>
</html>
