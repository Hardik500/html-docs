<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/chart.js"></script>
</head>
<body>
  <canvas id="myChart" width="400" height="200"></canvas>
  <script>
    new Chart(document.getElementById('myChart'), {
      type: 'bar',
      data: { labels: ['A','B','C'], datasets: [{ data: [10,20,30] }] }
    });
  </script>
</body>
</html>
