<!DOCTYPE html>
<html>
<head>
<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { width: 50px; height: 50px; border: 5px solid #eee; border-top-color: #3498db;
    border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p style="text-align:center">Pure CSS animation — no JS, no CDN</p>
</body>
</html>
