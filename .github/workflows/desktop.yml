name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "electron/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - "scripts/**"
      - ".github/workflows/desktop.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HTML_DOCS_REMOTE_URL: ${{ vars.HTML_DOCS_REMOTE_URL }}
      DESKTOP_REQUIRE_REMOTE_URL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Repeated from the CI workflow on purpose: a packaged installer should only
      # be produced from a tree that passes its own gates, and desktop.yml can run
      # on a push where CI was skipped or still in flight.
      - run: node test/csp-check.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run desktop:dist
      - run: npm run desktop:verify
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
